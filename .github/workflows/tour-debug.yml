name: tour-debug
on:
  push:
    branches: [claude/tour-fix]
jobs:
  dbg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: |
          node -e '
          const u="http://kungdo.or.kr/bbs/board.php?bo_table=game_news&page=1";
          for (const ua of ["gukgungrok (github.com/nowandong692/sisu-note)", "Mozilla/5.0 (compatible; gukgungrok)"]) {
            fetch(u,{headers:{"User-Agent":ua}}).then(async r=>{const t=await r.text(); console.log(ua, r.status, r.url, r.headers.get("content-type"), t.length, JSON.stringify(t.slice(0,300)));});
          }'
          sleep 8
          node scripts/tournaments.mjs | head -c 400 || true
