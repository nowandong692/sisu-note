name: tour-debug
on:
  push:
    branches: [claude/tour-fix]
jobs:
  dbg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/tournaments.mjs | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);console.log("COUNT",j.items.length);for(const t of j.items.slice(-8))console.log("ITEM",JSON.stringify(t))})'
