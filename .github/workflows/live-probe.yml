name: live-probe
on:
  push:
    branches: [claude/live-probe]
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0"
          B=https://result.sports.or.kr
          curl -sS -m 60 --retry 3 --retry-all-errors -A "$UA" -c jar -b jar -o inf.html "$B/NA/INF201.do" || true
          curl -sS -m 60 --retry 3 --retry-all-errors -A "$UA" -c jar -b jar -o main.html "$B/NA/main.do" || true
          curl -sS -m 60 --retry 3 --retry-all-errors -A "$UA" -c jar -b jar -o det.html -d "classCd=19&gubun=MTA&toCd=202616140&pageIndex=1" "$B/NA/INF202.do" || true
          curl -sS -m 60 --retry 3 --retry-all-errors -A "$UA" -o kd.html "http://kungdo.or.kr/" || true
          python3 - <<'PY'
          import re
          d=open('det.html',encoding='utf-8',errors='replace').read()
          for fn in ['fnEventVod','fnMainLiveScore','fnGameInfo','fnDetail','fnSchedule']:
              i=d.find('function '+fn)
              if i>=0: print('FN',fn, d[i:i+700].replace('\n',' ')[:700])
          for m in re.finditer(r'onclick="[^"]*"', d): print('ONCLICK', m.group(0)[:200])
          k=open('kd.html',encoding='utf-8',errors='replace').read()
          for m in re.finditer(r'(youtube[^"\']*|tv\.sports[^"\']*)', k): print('KDLINK', m.group(0)[:150])
          PY
          curl -sS -m 60 --retry 3 --retry-all-errors -A "Mozilla/5.0" -c jar -b jar -o vod.html -d "classCd=19&searchKeyword=&pageIndex=1" "$B/NA/INF307.do" || true
          python3 - <<'PY'
          import re
          from html import unescape
          d=open('vod.html',encoding='utf-8',errors='replace').read()
          print('VODLEN', len(d))
          for m in re.finditer(r'<tr[\s\S]*?</tr>', d):
              t=re.sub(r'\s+',' ',re.sub(r'<[^>]+>',' ',m.group(0))).strip()
              links=re.findall(r'(?:href|onclick)="([^"]+)"', m.group(0))
              if t: print('VOD', unescape(t)[:160], links[:2])
          PY
          curl -sS -m 30 "https://www.youtube.com/feeds/videos.xml?channel_id=UCAmMjZ44ugH9GmgYq0du5PQ" | grep -oE '<(title|published|yt:videoId)>[^<]*' | head -40 || true
          curl -sS -m 30 -A "Mozilla/5.0" -L "https://www.youtube.com/channel/UCAmMjZ44ugH9GmgYq0du5PQ" | grep -oE '<title>[^<]*</title>|"subscriberCountText":\{[^}]*\}' | head -3 || true
