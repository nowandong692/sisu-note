name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # 대회 일정과 중계 영상을 새로 받으려고 다시 배포한다: 아침 6시, 그리고 8시부터 18시까지 2시간마다 (한국 시간)
  schedule:
    - cron: '0 21,23,1,3,5,7,9 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          # 카카오맵 JavaScript 키 (저장소 Settings → Secrets and variables → Actions → Secrets)
          VITE_KAKAO_JS_KEY: ${{ secrets.KAKAO_JS_KEY }}
          # 온라인 랭킹 서버. 공개용 키만 넣는다 (secret/service_role 키는 절대 넣지 않는다).
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_ANON_KEY }}
      # 대한궁도협회 대회일정 게시판에서 대회명·기간·장소만 받아 둔다. 실패하면 지금 올라가 있는 파일을 그대로 쓴다.
      - name: 대회 일정 받기
        run: |
          node scripts/tournaments.mjs > tournaments.json \
            || curl -fsS -m 20 -o tournaments.json "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/tournaments.json" \
            || echo '{"items":[],"error":true}' > tournaments.json
          cp tournaments.json dist/tournaments.json
          head -c 300 dist/tournaments.json; echo
      # 경기 중계 채널(15시15중 유튜브)의 최근 영상. 실패하면 지금 올라가 있는 파일을 그대로 쓴다.
      - name: 활터 목록 받기
        run: |
          node scripts/hwalter.mjs > hwalter.json \
            || curl -fsS -m 20 -o hwalter.json "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/hwalter.json" \
            || echo '{"items":[],"error":true}' > hwalter.json
          cp hwalter.json dist/hwalter.json
          head -c 300 dist/hwalter.json; echo
      - name: 중계 영상 받기
        run: |
          node scripts/videos.mjs > videos.json \
            || curl -fsS -m 20 -o videos.json "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/videos.json" \
            || echo '{"items":[]}' > videos.json
          cp videos.json dist/videos.json
          head -c 300 dist/videos.json; echo
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
