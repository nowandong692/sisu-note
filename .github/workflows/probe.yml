name: probe-tournament-sources
on:
  push:
    branches: [claude/kungdo-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          cat > p.mjs <<'JS'
          const url='http://kungdo.or.kr/bbs/board.php?bo_table=game_news&wr_id=1262';
          let r=await fetch(url,{redirect:'manual'}); console.log('page',r.status,r.headers.get('location'),r.headers.getSetCookie());
          const html=await r.text(); const m=html.match(/href="([^"]*download\.php[^"]*)"/); console.log('dl',m&&m[1]);
          const ck=r.headers.getSetCookie().map(c=>c.split(';')[0]).join('; ');
          const f=await fetch(m[1].replace(/&amp;/g,'&'),{redirect:'manual',headers:{Cookie:ck,Referer:url}}); console.log('file',f.status,f.headers.get('content-type'),f.headers.get('location'));
          const b=Buffer.from(await f.arrayBuffer()); console.log(b.length, b.subarray(0,300).toString());
          JS
          node p.mjs
      - run: |
          for q in "15%EC%8B%9C%2015%EC%A4%91" "softfarm" "%EA%B6%81%EB%8F%84%20%EB%8C%80%ED%9A%8C"; do curl -sS "https://itunes.apple.com/search?term=$q&country=kr&entity=software&limit=8" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>JSON.parse(s).results.forEach(r=>console.log('IOS',r.trackId,r.trackName,r.sellerName,r.bundleId)))"; done
          for id in kr.softfarm.www.a1515 kr.co.linkweb.hwallo145; do echo "PLAY $id $(curl -s -o /dev/null -w '%{http_code}' "https://play.google.com/store/apps/details?id=$id&hl=ko")"; done
