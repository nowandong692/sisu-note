name: probe-tournament-sources
on:
  push:
    branches: [claude/kungdo-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sS -m 30 -A "Mozilla/5.0" -o a.html "http://kungdo.or.kr/?mcd=4030"
          curl -sS -m 30 -A "Mozilla/5.0" -o b.html "http://kungdo.or.kr/?mcd=4030&area=9"
          python3 - <<'PY'
          import re
          for f in ['a.html','b.html']:
              h=open(f,encoding='utf-8',errors='replace').read()
              print('=====',f,len(h))
              for m in re.finditer(r'area=\d+[^>]*>[^<]*',h): print('AREA',m.group(0)[:80])
              i=h.find('<table'); print(h[i:i+5000])
              print('PAGING', re.findall(r'href="[^"]*mcd=4030[^"]*"',h)[:40])
          PY
