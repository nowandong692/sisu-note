name: probe-tournament-sources
on:
  push:
    branches: [claude/kungdo-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: claude/tour-register }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: |
          node scripts/tournaments.mjs > t.json
          node -e "const f=require('./t.json');for(const t of f.items.filter(x=>x.doc||x.reg))console.log('T',t.start,t.name,'|',t.doc,'|',JSON.stringify(t.reg))"
