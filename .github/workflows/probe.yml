name: probe-tournament-sources
on:
  push:
    branches: [claude/kungdo-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: claude/range-finder }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: |
          node scripts/hwalter.mjs > h.json
          node -e "const f=require('./h.json');const c={};f.items.forEach(h=>c[h.region||'?']=(c[h.region||'?']||0)+1);console.log('COUNT',f.items.length,JSON.stringify(c));f.items.filter(h=>!h.region).forEach(h=>console.log('NOREGION',h.name,h.address))"
          echo "JSONSTART"; cat h.json; echo; echo "JSONEND"
