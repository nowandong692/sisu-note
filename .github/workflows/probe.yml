name: probe-tournament-sources
on:
  push:
    branches: [claude/kungdo-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sS -m 30 -A "Mozilla/5.0" -o a.html "http://kungdo.or.kr/?mcd=4030"
          python3 - <<'PY'
          import re
          h=open('a.html',encoding='utf-8',errors='replace').read()
          i=h.find('table-striped'); print(re.sub(r'\s+',' ',h[i-3000:i]))
          PY
          for a in $(seq 0 25); do n=$(curl -sS -m 20 -A "Mozilla/5.0" "http://kungdo.or.kr/?mcd=4030&area=$a" | grep -c '<td align="right">'); f=$(curl -sS -m 20 -A "Mozilla/5.0" "http://kungdo.or.kr/?mcd=4030&area=$a" | grep -o '<td>[^<]*' | sed -n 1p); echo "AREA $a $n $f"; done
