name: probe-tournament-sources
on:
  push:
    branches: [claude/kungdo-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: claude/tour-register }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: |
          node scripts/tournaments.mjs > t.json
          node -e "const f=require('./t.json');for(const t of f.items.filter(x=>x.doc||x.reg))console.log(t.start,t.name,'|',t.doc,'|',JSON.stringify(t.reg))"
      - run: |
          curl -sS "https://itunes.apple.com/search?term=15%EC%8B%9C15%EC%A4%91&country=kr&entity=software&limit=5" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>JSON.parse(s).results.forEach(r=>console.log(r.trackId,r.trackName,r.sellerName,r.bundleId,r.trackViewUrl)))"
          curl -sS "https://itunes.apple.com/search?term=%ED%99%9C%EB%A1%9C145&country=kr&entity=software&limit=5" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>JSON.parse(s).results.forEach(r=>console.log(r.trackId,r.trackName,r.sellerName,r.bundleId,r.trackViewUrl)))"
          curl -sSL "https://play.google.com/store/search?q=%ED%99%9C%EB%A1%9C145&c=apps&hl=ko" | grep -o 'details?id=[A-Za-z0-9_.]*' | sort -u | head
